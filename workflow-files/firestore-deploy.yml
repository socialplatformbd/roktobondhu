name: Deploy Firestore rules and indexes
# Run manually: Actions tab > this workflow > Run workflow.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Deploy rules + indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools deploy --only firestore --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" --non-interactive
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
